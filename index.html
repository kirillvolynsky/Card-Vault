<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<title>Card Vault</title>
</head>
<body>
<header>
  <h1>Card Vault</h1>
  <button id="addBtn" class="primary">＋ Add Card</button>
</header>

<main>
  <section id="empty" class="empty">
    <div class="empty-icon">▣</div>
    <h2>Your cards</h2>
    <p>Upload any image. Add a back image when you want a two-sided card.</p>
    <button id="emptyAdd" class="primary">Add your first card</button>
  </section>
  <section id="grid" class="grid"></section>
</main>

<!-- Editor -->
<div id="editor" class="modal hidden">
  <div class="sheet">
    <div class="sheet-head">
      <button id="cancelBtn">Cancel</button>
      <h2>Add Card</h2>
      <button id="doneBtn" class="primary">Done</button>
    </div>
    <div class="frontback">
      <div class="slot">
        <h3>Front</h3>
        <label class="upload">
          <input id="frontInput" type="file" accept="image/*">
          <img id="frontPreview" alt="">
          <span id="frontPrompt">＋ Upload front</span>
        </label>
      </div>
      <div class="slot">
        <h3>Back <small>optional</small></h3>
        <label class="upload">
          <input id="backInput" type="file" accept="image/*">
          <img id="backPreview" alt="">
          <span id="backPrompt">＋ Upload back</span>
        </label>
      </div>
    </div>
    <p class="hint">A card with a back flips when opened. Cards without a back simply show their image.</p>
  </div>
</div>

<!-- Viewer -->
<div id="viewer" class="viewer hidden">
  <button id="closeViewer" class="close">×</button>
  <div id="counter"></div>
  <div id="cardStage">
    <div id="card" class="card3d">
      <div class="face frontFace"><img id="viewFront" alt=""></div>
      <div class="face backFace"><img id="viewBack" alt=""></div>
    </div>
  </div>
  <div class="viewer-help">Swipe left/right to change cards · Tap a two-sided card to flip</div>
</div>

<script src="app.js"></script>
</body>
</html>
